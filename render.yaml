databases:
  - name: carbon-tracker-db
    plan: free

services:
  - type: web
    name: carbon-tracker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carbon-tracker-db
          property: connectionString