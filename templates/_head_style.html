<style>
  :root{
    --emerald-50:  #f0fdf4;
    --emerald-100: #dcfce7;
    --emerald-200: #bbf7d0;
    --emerald-400: #4ade80;
    --emerald-500: #22c55e;
    --emerald-600: #16a34a;
    --emerald-700: #15803d;

    --amber-500: #f59e0b;
    --amber-100: #fef3c7;
    --red-500:   #ef4444;
    --red-100:   #fee2e2;

    --ink-900: #0b1a12;
    --ink-700: #23342a;
    --ink-600: #4c5f55;
    --ink-400: #7d9188;
    --ink-200: #dbe7e0;

    --white: #ffffff;
    --paper: #f5faf6;
    --glass-bg: rgba(255,255,255,0.60);
    --glass-strong: rgba(255,255,255,0.85);
    --glass-border: rgba(255,255,255,0.6);

    --shadow-soft: 0 10px 28px -14px rgba(11,26,18,0.18);
    --shadow-lift: 0 24px 48px -20px rgba(11,26,18,0.30);

    --r-xl: 26px;
    --r-lg: 18px;
    --r-md: 13px;
    --r-sm: 9px;

    --font-display: 'Poppins', sans-serif;
    --font-body: 'Inter', sans-serif;

    --nav-h: 72px;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; scroll-padding-top:calc(var(--nav-h) + 12px); }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *,*::before,*::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--ink-900);
    background:
      radial-gradient(1000px 560px at 90% -8%, rgba(34,197,94,0.14), transparent 58%),
      radial-gradient(760px 460px at -8% 18%, rgba(21,128,61,0.09), transparent 55%),
      var(--paper);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,h4{ font-family:var(--font-display); margin:0; color:var(--ink-900); letter-spacing:-0.01em; }
  p{ margin:0; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:var(--emerald-200); color:var(--ink-900); }
  :focus-visible{ outline:2.5px solid var(--emerald-600); outline-offset:3px; border-radius:6px; }

  .container{ max-width:1240px; margin:0 auto; padding:0 28px; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

  .skip-link{
    position:absolute; left:16px; top:-60px;
    background:var(--emerald-700); color:#fff;
    padding:10px 16px; border-radius:10px; z-index:999;
    transition:top 0.2s ease;
  }
  .skip-link:focus{ top:16px; }

  /* ---------------- Decorative blobs ---------------- */
  .blob-field{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .blob{ position:absolute; border-radius:50%; filter:blur(72px); opacity:0.22; }
  .blob--a{ width:460px; height:460px; top:-120px; right:-90px; background:radial-gradient(circle, var(--emerald-400), transparent 70%); animation:drift1 22s ease-in-out infinite; }
  .blob--b{ width:340px; height:340px; top:44%; left:-140px; background:radial-gradient(circle, var(--emerald-600), transparent 70%); animation:drift2 26s ease-in-out infinite; }
  .blob--c{ width:280px; height:280px; bottom:-90px; right:18%; background:radial-gradient(circle, var(--emerald-200), transparent 70%); animation:drift1 30s ease-in-out infinite reverse; }
  @keyframes drift1{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-28px,36px) scale(1.07); } }
  @keyframes drift2{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(36px,-28px) scale(1.05); } }

  /* ---------------- Navbar ---------------- */
  .navbar{
    position:sticky; top:0; z-index:100; height:var(--nav-h);
    display:flex; align-items:center;
    background:var(--glass-strong);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    border-bottom:1px solid rgba(11,26,18,0.08);
    transition:box-shadow 0.25s ease;
  }
  .navbar.is-scrolled{ box-shadow:0 8px 24px -16px rgba(11,26,18,0.28); }
  .navbar__inner{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:1.14rem; }
  .brand__mark{
    width:34px; height:34px; display:grid; place-items:center; border-radius:10px;
    background:linear-gradient(135deg, var(--emerald-500), var(--emerald-700));
    box-shadow:0 6px 16px -6px rgba(21,128,61,0.55);
  }
  .brand__mark svg{ width:19px; height:19px; }

  .nav-links{ display:flex; align-items:center; gap:4px; }
  .nav-links a{
    padding:9px 14px; border-radius:999px; font-size:0.92rem; font-weight:500;
    color:var(--ink-600); transition:background 0.18s ease, color 0.18s ease;
    position:relative;
  }
  .nav-links a:hover{ background:var(--emerald-50); color:var(--emerald-700); }
  .nav-links a.is-active{ background:var(--emerald-100); color:var(--emerald-700); }

  .status-pill{
    display:flex; align-items:center; gap:8px; padding:7px 14px 7px 10px; border-radius:999px;
    background:var(--emerald-50); border:1px solid var(--emerald-100);
    font-size:0.82rem; font-weight:600; color:var(--emerald-700);
    transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .status-dot{
    width:8px; height:8px; border-radius:50%; background:var(--emerald-500);
    animation:pulse-dot 2.2s ease-in-out infinite;
  }
  .status-pill.is-down{ background:var(--red-100); border-color:#fecaca; color:#991b1b; }
  .status-pill.is-down .status-dot{ background:var(--red-500); animation:none; }
  @keyframes pulse-dot{
    0%{ box-shadow:0 0 0 0 rgba(34,197,94,0.5); }
    70%{ box-shadow:0 0 0 8px rgba(34,197,94,0); }
    100%{ box-shadow:0 0 0 0 rgba(34,197,94,0); }
  }

  .nav-toggle{
    display:none; width:40px; height:40px; border-radius:10px;
    border:1px solid var(--ink-200); background:#fff; align-items:center; justify-content:center;
  }
  .nav-toggle svg{ width:18px; height:18px; }

  /* ---------------- User menu ---------------- */
  .auth-actions{ display:flex; align-items:center; gap:8px; }
  .user-menu{ position:relative; }
  .user-menu__trigger{
    display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border-radius:999px;
    background:var(--glass-strong); border:1px solid var(--glass-border);
    transition:background 0.18s ease, box-shadow 0.18s ease;
  }
  .user-menu__trigger:hover{ background:#fff; box-shadow:var(--shadow-soft); }
  .user-menu__avatar{
    width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    background:linear-gradient(135deg, var(--emerald-500), var(--emerald-700)); color:#fff;
    font-family:var(--font-display); font-weight:700; font-size:0.86rem; flex-shrink:0;
    object-fit:cover;
  }
  .user-menu__name{ font-size:0.88rem; font-weight:600; color:var(--ink-700); white-space:nowrap; }
  .user-menu__chevron{ width:14px; height:14px; color:var(--ink-400); transition:transform 0.18s ease; flex-shrink:0; }
  .user-menu.is-open .user-menu__chevron{ transform:rotate(180deg); }
  .user-menu__dropdown{
    position:absolute; top:calc(100% + 10px); right:0; min-width:180px;
    background:var(--glass-strong); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border); border-radius:var(--r-md); box-shadow:var(--shadow-lift);
    padding:6px; display:flex; flex-direction:column; gap:2px;
    opacity:0; transform:translateY(-6px); pointer-events:none;
    transition:opacity 0.16s ease, transform 0.16s ease;
  }
  .user-menu.is-open .user-menu__dropdown{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .user-menu__dropdown a{
    display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:9px;
    font-size:0.88rem; font-weight:500; color:var(--ink-700);
    transition:background 0.15s ease, color 0.15s ease;
  }
  .user-menu__dropdown a:hover{ background:var(--emerald-50); color:var(--emerald-700); }
  .user-menu__dropdown a svg{ width:16px; height:16px; flex-shrink:0; }
  .user-menu__dropdown hr{ border:none; border-top:1px solid var(--ink-200); margin:4px 2px; }

  /* ---------------- Section shell ---------------- */
  section{ scroll-margin-top:calc(var(--nav-h) + 12px); }
  .section-inner{ padding:64px 0; }
  .section-inner + .section-inner{ padding-top:0; }
  .section-head{ margin-bottom:28px; }
  .section-head .eyebrow{
    font-size:0.82rem; font-weight:700; color:var(--emerald-700); margin-bottom:8px; display:block;
  }
  .section-head h2{ font-size:1.7rem; font-weight:700; }
  .section-head p{ margin-top:8px; font-size:0.98rem; color:var(--ink-600); max-width:56ch; }

  .reveal{ opacity:0; transform:translateY(18px); transition:opacity 0.6s ease, transform 0.6s ease; }
  .reveal.is-visible{ opacity:1; transform:translateY(0); }

  .card{
    border-radius:var(--r-lg);
    background:var(--glass-strong);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow-soft);
    transition:box-shadow 0.25s cubic-bezier(0.22,1,0.36,1), transform 0.25s cubic-bezier(0.22,1,0.36,1), border-color 0.25s ease;
  }

  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:14px 26px; border-radius:14px;
    font-weight:600; font-size:0.98rem; border:none;
    transition:transform 0.18s cubic-bezier(0.22,1,0.36,1), box-shadow 0.18s ease, background 0.18s ease, opacity 0.18s ease;
  }
  .btn:active:not(:disabled){ transform:translateY(0) scale(0.97); }
  .btn--primary{
    color:#fff; background:linear-gradient(135deg, var(--emerald-500), var(--emerald-700));
    box-shadow:0 14px 30px -12px rgba(21,128,61,0.55);
  }
  .btn--primary:hover{ transform:translateY(-2px); box-shadow:0 20px 36px -14px rgba(21,128,61,0.6); }
  .btn--ghost{ color:var(--ink-700); background:var(--glass-strong); border:1px solid var(--glass-border); }
  .btn--ghost:hover{ transform:translateY(-2px); background:#fff; }
  .btn--outline{
    color:var(--emerald-700); background:#fff; border:1.5px solid var(--emerald-200);
  }
  .btn--outline:hover{ background:var(--emerald-50); border-color:var(--emerald-400); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

  /* ---------------- Hero / Dashboard ---------------- */
  .hero{ padding:44px 0 60px; }
  .hero__inner{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:52px; align-items:center; }
  .eyebrow-leaf{
    display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:999px;
    background:var(--glass-bg); border:1px solid var(--glass-border); box-shadow:var(--shadow-soft);
    font-size:0.85rem; font-weight:600; color:var(--emerald-700); margin-bottom:20px;
  }
  .hero h1{
    font-size:clamp(2.3rem, 4vw, 3.4rem); line-height:1.1; font-weight:700; max-width:16ch;
  }
  .hero p.lede{ margin-top:20px; font-size:1.06rem; color:var(--ink-600); max-width:46ch; line-height:1.65; }
  .hero__actions{ margin-top:32px; display:flex; gap:14px; flex-wrap:wrap; }

  .hero__visual{ position:relative; aspect-ratio:1/1; max-width:400px; margin:0 auto; }
  .leaf-orbit{ position:absolute; inset:0; animation:spin-slow 42s linear infinite; }
  @keyframes spin-slow{ to{ transform:rotate(360deg); } }
  .leaf-orbit svg{ position:absolute; }

  .hero-gauge-card{
    position:absolute; inset:9%; border-radius:32px;
    background:var(--glass-strong); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-border); box-shadow:var(--shadow-lift);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px;
  }
  .mini-gauge{ position:relative; width:78%; }
  .mini-gauge svg{ width:100%; height:auto; display:block; }
  .mini-gauge-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    white-space:nowrap;
  }
  .mini-gauge-center b{ font-family:var(--font-display); font-size:2.1rem; font-weight:800; letter-spacing:-0.02em; }
  .mini-gauge-center span{ font-size:0.72rem; color:var(--ink-400); white-space:nowrap; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; margin-top:2px; }

  /* ---------------- KPI cards ---------------- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
  .kpi-card{
    padding:20px; display:flex; flex-direction:column; gap:10px;
    transition:transform 0.22s ease, box-shadow 0.22s ease;
  }
  .kpi-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-lift); }
  .kpi-card__icon{
    width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
    background:var(--emerald-50); color:var(--emerald-700);
  }
  .kpi-card__icon svg{ width:19px; height:19px; }
  .kpi-card b{ font-family:var(--font-display); font-size:1.55rem; font-weight:700; white-space:nowrap; letter-spacing:-0.01em; }
  .kpi-card span{ font-size:0.74rem; color:var(--ink-400); text-transform:uppercase; letter-spacing:0.05em; font-weight:600; }
  .kpi-card--primary{ background:linear-gradient(160deg, var(--emerald-50), var(--glass-strong)); border-color:var(--emerald-200); }
  .kpi-card--primary .kpi-card__icon{ background:linear-gradient(135deg, var(--emerald-500), var(--emerald-700)); color:#fff; }

  /* ---------------- Calculator ---------------- */
  #calculator{ position:relative; }
  #calculator::before{
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:min(1240px, calc(100% - 56px)); height:1px;
    background:linear-gradient(90deg, transparent, rgba(11,26,18,0.12), transparent);
  }
  .calc-grid{ display:grid; grid-template-columns:0.9fr 1.35fr; gap:20px; align-items:start; }

  .gauge-card{ padding:26px 22px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; }
  .gauge-card h3{ font-size:1.05rem; align-self:flex-start; }
  .gauge-wrap{ position:relative; width:clamp(170px, 42vw, 240px); max-width:240px; margin:10px auto 0; filter:drop-shadow(0 10px 20px -12px rgba(21,128,61,0.35)); }
  .gauge-wrap svg{ width:100%; height:auto; display:block; }
  .gauge-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; white-space:nowrap; gap:2px; }
  .gauge-center b{ font-family:var(--font-display); font-size:2.5rem; font-weight:800; letter-spacing:-0.02em; line-height:1; color:var(--ink-900); }
  .gauge-center span{ font-size:0.72rem; color:var(--ink-400); white-space:nowrap; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; }
  .gauge-track{ stroke:var(--emerald-100); }
  .gauge-fill{
    stroke:var(--emerald-500); stroke-linecap:round;
    transition:stroke-dashoffset 1.1s cubic-bezier(0.22,1,0.36,1), stroke 0.4s ease;
  }

  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px;
    font-size:0.82rem; font-weight:700;
  }
  .badge--low{ background:var(--emerald-100); color:var(--emerald-700); }
  .badge--medium{ background:var(--amber-100); color:#92400e; }
  .badge--high{ background:var(--red-100); color:#991b1b; }
  .badge--idle{ background:var(--ink-200); color:var(--ink-600); }

  .badge-scale{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .badge-scale span{
    font-size:0.72rem; font-weight:600; padding:4px 10px; border-radius:999px; opacity:0.55;
    transition:opacity 0.2s ease, transform 0.2s ease;
  }
  .badge-scale span.is-active{ opacity:1; transform:scale(1.06); }
  .badge-scale .s-low{ background:var(--emerald-100); color:var(--emerald-700); }
  .badge-scale .s-medium{ background:var(--amber-100); color:#92400e; }
  .badge-scale .s-high{ background:var(--red-100); color:#991b1b; }

  .eco-tip{
    font-size:0.86rem; color:var(--ink-600); line-height:1.55;
    background:var(--emerald-50); border-radius:var(--r-sm); padding:12px 14px; text-align:left;
  }

  .calc-card{ padding:28px 28px 26px; }
  .calc-card__head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap; }
  .calc-card h3{ font-size:1.05rem; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px 20px; transition:opacity 0.2s ease; }
  .calc-card:has(.btn--submit.is-loading) .field-grid{ opacity:0.55; pointer-events:none; }
  .field{ display:flex; flex-direction:column; gap:7px; }
  .field label{ font-size:0.8rem; font-weight:600; color:var(--ink-700); }
  .field .unit{ font-weight:400; color:var(--ink-400); }
  .field input, .field select{
    font-family:inherit; font-size:0.94rem; padding:11px 13px; border-radius:11px;
    border:1.5px solid var(--ink-200); background:#fff; color:var(--ink-900);
    transition:border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .field input:hover, .field select:hover{ border-color:var(--emerald-400); }
  .field input:focus, .field select:focus{
    outline:none; border-color:var(--emerald-500); box-shadow:0 0 0 4px rgba(34,197,94,0.15);
  }
  .field-error{ font-size:0.74rem; color:var(--red-500); min-height:14px; }

  .calc-actions{ margin-top:20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .btn--submit{
    position:relative; color:#fff; background:linear-gradient(135deg, var(--emerald-500), var(--emerald-700));
    box-shadow:0 14px 26px -12px rgba(21,128,61,0.55); min-width:190px; justify-content:center;
  }
  .btn--submit:hover{ transform:translateY(-2px); }
  .btn--submit:disabled{ opacity:0.75; cursor:progress; transform:none; }
  .btn--submit .spinner{
    width:16px; height:16px; border-radius:50%; border:2.5px solid rgba(255,255,255,0.4);
    border-top-color:#fff; animation:spin 0.7s linear infinite; display:none;
  }
  .btn--submit.is-loading .spinner{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .calc-hint{ font-size:0.8rem; color:var(--ink-400); }

  /* ---------------- Prediction result card ---------------- */
  .result-card{
    display:grid; grid-template-columns:auto 1fr auto; gap:20px; align-items:center;
    border-left:3px solid var(--emerald-400);
    box-shadow:var(--shadow-lift);
    margin-top:0; padding:0 24px; max-height:0; overflow:hidden;
    opacity:0; transform:translateY(10px) scale(0.98);
    transition:opacity 0.45s ease, transform 0.45s cubic-bezier(0.22,1,0.36,1),
               max-height 0.45s cubic-bezier(0.22,1,0.36,1), margin-top 0.45s ease, padding 0.45s ease;
  }
  .result-card.is-visible{
    opacity:1; transform:translateY(0) scale(1);
    max-height:320px; margin-top:22px; padding:22px 24px;
  }
  .result-card:has(.badge--medium){ border-left-color:var(--amber-500); }
  .result-card:has(.badge--high){ border-left-color:var(--red-500); }
  .result-card__main{ display:flex; align-items:baseline; gap:8px; }
  .result-card__main b{ font-family:var(--font-display); font-size:2.2rem; font-weight:800; letter-spacing:-0.02em; }
  .result-card__main span{ font-size:0.92rem; color:var(--ink-400); white-space:nowrap; }
  .result-card__meta{ display:flex; flex-direction:column; gap:6px; }
  .result-card__meta p{ font-size:0.86rem; color:var(--ink-600); line-height:1.5; max-width:56ch; }
  .result-card__tags{ display:flex; gap:8px; flex-wrap:wrap; font-size:0.76rem; color:var(--ink-400); }
  .result-card__tags span{ background:var(--emerald-50); padding:4px 10px; border-radius:999px; }

  /* ---------------- Analytics ---------------- */
  .analytics-grid{ display:grid; grid-template-columns:1.15fr 0.85fr; gap:20px; }
  .analytics-card{ padding:24px; transition:box-shadow 0.25s ease, transform 0.25s ease; }
  .analytics-card:hover{ box-shadow:var(--shadow-lift); transform:translateY(-2px); }
  .analytics-card h3{ font-size:1.02rem; margin-bottom:4px; }
  .analytics-card .sub{ font-size:0.82rem; color:var(--ink-400); margin-bottom:18px; display:block; }

  .contrib-row{ display:flex; flex-direction:column; gap:7px; margin-bottom:18px; }
  .contrib-row:last-child{ margin-bottom:0; }
  .contrib-row__label{
    display:flex; justify-content:space-between; font-size:0.85rem; color:var(--ink-700); font-weight:500;
  }
  .contrib-row__label span:last-child{ color:var(--emerald-700); font-weight:700; }
  .contrib-track{ height:10px; border-radius:999px; background:var(--emerald-50); overflow:hidden; box-shadow:inset 0 1px 2px rgba(11,26,18,0.06); }
  .contrib-fill{
    height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--emerald-400), var(--emerald-600));
    width:0%; transition:width 1.1s cubic-bezier(0.22,1,0.36,1);
  }

  .largest-source{
    margin-top:22px; padding:16px; border-radius:var(--r-md); background:var(--emerald-50);
    border:1px solid var(--emerald-100);
